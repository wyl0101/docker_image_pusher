
name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-24.04.04

    steps:
      
      # 彻底清理 Docker 历史垃圾
      - name: Deep clean Docker storage
        run: |
          echo "========== 清理前磁盘 =========="
          df -hT
          df -i

          echo "========== Docker 磁盘占用 =========="
          docker system df -v || true

          echo "========== 清理 Docker 容器 =========="
          docker container prune -f

          echo "========== 清理 Docker 镜像 =========="
          docker image prune -af

          echo "========== 清理 Docker 数据卷 =========="
          docker volume prune -af

          echo "========== 清理 Docker 网络 =========="
          docker network prune -f

          echo "========== 清理 Build Cache =========="
          docker builder prune -af || true

          echo "========== 清理 Buildx Cache =========="
          docker buildx prune -af || true

          echo "========== 清理系统缓存 =========="
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "========== 清理后磁盘 =========="
          df -hT
          df -i

          echo "========== Docker 存储占用 =========="
          docker system df -v || true

      # 诊断磁盘空间
      - name: Diagnose disk space
        run: |
          echo "========== 磁盘使用情况 =========="
          df -hT

          echo "========== inode 使用情况 =========="
          df -i

          echo "========== Docker 目录 =========="
          sudo du -sh /var/lib/docker 2>/dev/null || true

          echo "========== Containerd 目录 =========="
          sudo du -sh /var/lib/containerd 2>/dev/null || true

          echo "========== 临时目录 =========="
          sudo du -sh /tmp 2>/dev/null || true

          echo "========== 根目录占用排行 =========="
          sudo du -xhd1 / 2>/dev/null | sort -h

          echo "========== Docker 存储信息 =========="
          docker info

      # 查看初始磁盘空间
      - name: Before freeing up disk space
        run: |
          df -hT
          df -i

      # 扩展 Docker 可用磁盘空间
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          build-mount-path: '/var/lib/docker/'

      # 重启 Docker
      - name: Restart docker
        run: sudo service docker restart

      # 检查磁盘空间
      - name: Check disk space
        run: |
          echo "Docker disk:"
          df -hT /var/lib/docker

          echo "Containerd disk:"
          df -hT /var/lib/containerd

          echo "Inodes:"
          df -i

          echo "Docker info:"
          docker info

      - name: Checkout Code
        uses: actions/checkout@v4

      # 注意：删除 Docker Setup Buildx 步骤
      # 当前工作流使用 docker pull/tag/push，不需要 Buildx

      - name: Build and push image Aliyun
        shell: bash
        run: |
          set -euo pipefail

          # 登录阿里云
          echo "$ALIYUN_REGISTRY_PASSWORD" | docker login \
            -u "$ALIYUN_REGISTRY_USER" \
            --password-stdin "$ALIYUN_REGISTRY"

          # 以下保留你原来的镜像处理脚本
          declare -A duplicate_images
          declare -A temp_map

          while IFS= read -r line || [ -n "$line" ]; do
              [[ -z "$line" ]] && continue
              [[ "$line" =~ ^[[:space:]]*# ]] && continue

              image=$(echo "$line" | awk '{print $NF}')
              image="${image%%@*}"

              image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
              name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')

              name_space="${name_space}_"
              image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

              if [[ -n "${temp_map[$image_name]:-}" ]]; then
                  if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                      duplicate_images[$image_name]="true"
                  fi
              else
                  temp_map[$image_name]=$name_space
              fi

          done < images.txt

          while IFS= read -r line || [ -n "$line" ]; do
              [[ -z "$line" ]] && continue
              [[ "$line" =~ ^[[:space:]]*# ]] && continue

              echo "docker pull $line"
              docker pull $line

              platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')

              if [ -z "$platform" ]; then
                  platform_prefix=""
              else
                  platform_prefix="${platform//\//_}_"
              fi

              image=$(echo "$line" | awk '{print $NF}')
              image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
              name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
              image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

              name_space_prefix=""

              if [[ -n "${duplicate_images[$image_name]:-}" ]]; then
                  if [[ -n "$name_space" ]]; then
                      name_space_prefix="${name_space}_"
                  fi
              fi

              image_name_tag="${image_name_tag%%@*}"

              new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

              echo "docker tag $image $new_image"
              docker tag "$image" "$new_image"

              echo "docker push $new_image"
              docker push "$new_image"

              echo "清理磁盘空间"

              docker rmi "$image" || true
              docker rmi "$new_image" || true

              df -hT

          done < images.txt
